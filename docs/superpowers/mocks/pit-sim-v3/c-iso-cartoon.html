<body><canvas id="c" width="780" height="1688"></canvas>
<script>
// Mock C: smooth isometric cartoon (Cafeland finish). A picture, not a game.
// Drawn at device resolution 780x1688, shown at 390x844 CSS px.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 780, H = 1688;
const OX = 400, OY = 320, HW = 75, HH = 37.5;
const P = (i, j) => [OX + HW * (i - j), OY + HH * (i + j)];
const up = (p, h) => [p[0], p[1] - h];
let seed = 20261018;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const INK = '#4a2a18';
const F = '"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif';
const TAU = Math.PI * 2;

// ---------- helpers ----------
function poly(pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]); g.closePath(); }
function fs(fill, stroke = INK, lw = 3) { if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); } }
function lg(x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(s => gr.addColorStop(s[0], s[1])); return gr; }
function rg(x, y, r, stops, fx, fy) { const gr = g.createRadialGradient(fx ?? x, fy ?? y, 0, x, y, r); stops.forEach(s => gr.addColorStop(s[0], s[1])); return gr; }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); }
function circ(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function shade(hex, a) { // a in -1..1
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
  const t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round(r + (t - r) * p); gg = Math.round(gg + (t - gg) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${gg},${b})`;
}
function shadow(x, y, rx, ry, a = 0.2) { ell(x, y, rx, ry); g.fillStyle = `rgba(50,35,10,${a})`; g.fill(); }
function limb(pts, col, w) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]);
  g.strokeStyle = INK; g.lineWidth = w + 5; g.stroke();
  g.strokeStyle = col; g.lineWidth = w; g.stroke();
}
function text(t, x, y, size, fill, stroke = INK, lw = 0, align = 'left', weight = 'bold') {
  g.font = `${weight} ${size}px ${F}`; g.textAlign = align; g.textBaseline = 'alphabetic';
  if (lw) { g.lineJoin = 'round'; g.strokeStyle = stroke; g.lineWidth = lw; g.strokeText(t, x, y); }
  g.fillStyle = fill; g.fillText(t, x, y);
}
function star(x, y, r, fill, stroke = INK, lw = 3) {
  g.beginPath();
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? r * 0.48 : r; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  g.closePath(); fs(fill, stroke, lw);
}
function heart(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 14);
  g.bezierCurveTo(-30, -6, -18, -30, 0, -14);
  g.bezierCurveTo(18, -30, 30, -6, 0, 14); g.closePath();
  fs(lg(0, -26, 0, 14, [[0, '#ff8fb1'], [1, '#e8346a']]), '#7a1630', 3);
  ell(-9, -12, 5, 3.5, -0.6); g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
  g.restore();
}
function coin(x, y, r) {
  circ(x, y + 2, r); g.fillStyle = 'rgba(0,0,0,.25)'; g.fill();
  circ(x, y, r); fs(rg(x, y, r, [[0, '#fff3a8'], [0.55, '#ffd23f'], [1, '#e09a12']], x - r * .35, y - r * .35), '#7a4a08', Math.max(2, r * .12));
  circ(x, y, r * .66); g.strokeStyle = 'rgba(160,95,10,.75)'; g.lineWidth = Math.max(1.5, r * .1); g.stroke();
  ell(x - r * .3, y - r * .35, r * .25, r * .14, -0.6); g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
}
function sparkle(x, y, r, col = '#fff') {
  g.beginPath(); g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r);
  g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.closePath(); g.fillStyle = col; g.fill();
}

// iso box: footprint (i,j) size (di,dj), height h. Base raised by z.
function isoBox(i, j, di, dj, h, top, left, right, z = 0, lw = 3) {
  const A = up(P(i, j), z), B = up(P(i + di, j), z), C = up(P(i + di, j + dj), z), D = up(P(i, j + dj), z);
  poly([D, C, up(C, h), up(D, h)]); fs(lg(0, D[1] - h, 0, D[1], [[0, left], [1, shade(left.startsWith('#') ? left : '#888888', -0.12)]]), INK, lw);
  poly([C, B, up(B, h), up(C, h)]); fs(right, INK, lw);
  poly([up(A, h), up(B, h), up(C, h), up(D, h)]); fs(top, INK, lw);
  return { A, B, C, D };
}

// ---------- food icons ----------
function plate(x, y, r) {
  ell(x, y + r * .12, r, r * .5); g.fillStyle = 'rgba(40,30,20,.22)'; g.fill();
  ell(x, y, r, r * .5); fs(lg(x, y - r * .5, x, y + r * .5, [[0, '#ffffff'], [1, '#d9e2ec']]), INK, Math.max(2, r * .07));
  ell(x, y - r * .03, r * .72, r * .34); g.strokeStyle = 'rgba(140,165,190,.7)'; g.lineWidth = Math.max(1.5, r * .05); g.stroke();
  ell(x - r * .45, y - r * .2, r * .2, r * .07, -0.3); g.fillStyle = 'rgba(255,255,255,.95)'; g.fill();
}
function sausage(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(-26, 7); g.quadraticCurveTo(0, -15, 26, 7);
  g.strokeStyle = '#3a1a10'; g.lineWidth = 24; g.stroke();
  g.strokeStyle = lg(0, -12, 0, 12, [[0, '#d9643c'], [1, '#9c3520']]); g.lineWidth = 18; g.stroke();
  g.beginPath(); g.moveTo(-20, -1); g.quadraticCurveTo(0, -14, 20, -1);
  g.strokeStyle = 'rgba(255,200,160,.85)'; g.lineWidth = 4; g.stroke();
  g.strokeStyle = 'rgba(60,20,10,.75)'; g.lineWidth = 3.5;
  [[-13, 0], [0, -4], [13, 0]].forEach(([a, b]) => { g.beginPath(); g.moveTo(a - 4, b + 7); g.lineTo(a + 4, b - 3); g.stroke(); });
  g.restore();
}
function chicken(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(-0.5);
  limb([[6, 0], [30, 0]], '#fbf3e4', 9);
  circ(33, -5, 6); fs('#fbf3e4', INK, 2.5); circ(33, 5, 6); fs('#fbf3e4', INK, 2.5);
  g.beginPath(); g.moveTo(10, -9); g.bezierCurveTo(-4, -26, -34, -22, -32, 0); g.bezierCurveTo(-34, 22, -4, 26, 10, 9); g.closePath();
  fs(lg(0, -22, 0, 22, [[0, '#f2b14b'], [0.6, '#cf7a26'], [1, '#9a4f17']]), INK, 3);
  ell(-14, -10, 10, 4.5, -0.2); g.fillStyle = 'rgba(255,240,190,.85)'; g.fill();
  g.strokeStyle = 'rgba(110,50,15,.55)'; g.lineWidth = 2.5;
  [[-20, 6], [-8, 10]].forEach(([a, b]) => { g.beginPath(); g.moveTo(a, b); g.lineTo(a + 8, b - 5); g.stroke(); });
  g.restore();
}
function ribs(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(-0.18);
  for (let k = 0; k < 5; k++) { rr(-30 + k * 13, 8, 7, 12, 3); fs('#fbf3e4', INK, 2.2); }
  g.beginPath(); g.moveTo(-36, -12); g.quadraticCurveTo(0, -24, 36, -12); g.lineTo(34, 12); g.quadraticCurveTo(0, 18, -34, 12); g.closePath();
  fs(lg(0, -20, 0, 14, [[0, '#c4522f'], [0.5, '#8f2b17'], [1, '#5e1a0e']]), '#2e120a', 3);
  g.strokeStyle = 'rgba(40,10,5,.6)'; g.lineWidth = 2.5;
  for (let k = 1; k < 5; k++) { const xx = -36 + k * 14.4; g.beginPath(); g.moveTo(xx, -15 + Math.abs(xx) * .1); g.lineTo(xx - 1, 13); g.stroke(); }
  g.beginPath(); g.moveTo(-26, -11); g.quadraticCurveTo(0, -19, 26, -11); g.strokeStyle = 'rgba(255,190,150,.8)'; g.lineWidth = 3.5; g.stroke();
  g.restore();
}
function briskSlice(x, y, w, h) {
  rr(x, y, w, h, 5); fs('#2e1a10', '#21110a', 2);
  rr(x + 3, y + 3, w - 6, h - 5, 4); g.fillStyle = '#e06173'; g.fill();
  rr(x + 6, y + 6, w - 12, h - 10, 3); g.fillStyle = lg(0, y, 0, y + h, [[0, '#b8634a'], [1, '#8d4330']]); g.fill();
  g.strokeStyle = 'rgba(255,220,200,.5)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x + 9, y + 9); g.lineTo(x + w - 10, y + 9); g.stroke();
}
function brisket(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  briskSlice(-30, -16, 40, 20); briskSlice(-16, -8, 40, 20); briskSlice(-2, 0, 40, 20);
  g.restore();
}
function bubble(x, y, drawFn, left) { // tail points to (x,y)
  const w = 96, h = 86, bx = left ? x - w - 8 : x + 8, by = y - 112;
  g.save();
  rr(bx, by + 6, w, h, 18); g.fillStyle = 'rgba(30,20,10,.18)'; g.fill();
  g.beginPath(); g.roundRect(bx, by, w, h, 18);
  const t0 = left ? bx + w - 40 : bx + 18; g.moveTo(t0, by + h - 1); g.lineTo(x, y); g.lineTo(t0 + 22, by + h - 1);
  g.fillStyle = '#ffffff'; g.fill();
  g.strokeStyle = 'rgba(110,130,150,.9)'; g.lineWidth = 3; g.stroke();
  g.beginPath(); g.moveTo(t0 + 1, by + h - 4); g.lineTo(t0 + 21, by + h - 4); g.strokeStyle = '#fff'; g.lineWidth = 6; g.stroke();
  drawFn(bx + w / 2, by + h / 2 + 4);
  g.restore();
}

// ---------- people ----------
const SKIN = { a: '#ffd9b8', b: '#f1c08f', c: '#c98a5a', d: '#8d5a3a' };
function person(x, y, o) {
  const s = o.s || 1, face = o.face ?? 0, back = face === 'back', fx = back ? 0 : face * 6;
  const skin = o.skin || SKIN.a, hair = o.hair || '#5a3420';
  g.save(); g.translate(x, y); g.scale(s, s);
  if (!o.seated) shadow(0, 2, 34, 11, .22); else g.translate(0, 34);
  if (!o.seated) {
    const lo = o.walk ? 7 : 0;
    limb([[-9, -40], [-10 - lo, -9]], o.pants || '#3b4f7a', 14);
    limb([[9, -40], [10 + lo, -9]], o.pants || '#3b4f7a', 14);
    ell(-12 - lo, -5, 11, 7); fs('#3a2a22', INK, 2.5);
    ell(12 + lo, -5, 11, 7); fs('#3a2a22', INK, 2.5);
  }
  const shirt = o.shirt || '#4aa3df';
  const pose = o.pose || 'idle';
  // back arms (behind body)
  if (pose === 'tongs') limb([[18, -76], [26, -48]], shirt, 13);
  // body
  g.beginPath();
  g.moveTo(-20, -90); g.quadraticCurveTo(-29, -90, -29, -78); g.lineTo(-27, -42); g.quadraticCurveTo(-27, -34, -19, -34);
  g.lineTo(19, -34); g.quadraticCurveTo(27, -34, 27, -42); g.lineTo(29, -78); g.quadraticCurveTo(29, -90, 20, -90); g.closePath();
  fs(lg(-29, 0, 29, 0, [[0, shade(shirt, .25)], [0.5, shirt], [1, shade(shirt, -0.18)]]), INK, 3);
  if (o.apron) {
    g.beginPath(); g.moveTo(-15, -78); g.lineTo(15, -78); g.lineTo(19, -36); g.quadraticCurveTo(0, -31, -19, -36); g.closePath();
    fs(lg(0, -78, 0, -34, [[0, shade(o.apron, .12)], [1, shade(o.apron, -0.12)]]), INK, 2.5);
    rr(-9, -58, 18, 10, 3); fs(shade(o.apron, -0.18), 'rgba(40,20,10,.5)', 1.5);
    g.strokeStyle = INK; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-13, -78); g.lineTo(-8, -90); g.moveTo(13, -78); g.lineTo(8, -90); g.stroke();
  }
  // front arms + props
  if (pose === 'idle') {
    limb([[-22, -78], [-28, -48]], shirt, 13); limb([[22, -78], [28, -48]], shirt, 13);
    circ(-28, -45, 7.5); fs(skin, INK, 2.5); circ(28, -45, 7.5); fs(skin, INK, 2.5);
  } else if (pose === 'hold') { // hands together in front
    limb([[-22, -78], [-12, -52]], shirt, 13); limb([[22, -78], [12, -52]], shirt, 13);
    circ(-8, -50, 7.5); fs(skin, INK, 2.5); circ(8, -50, 7.5); fs(skin, INK, 2.5);
  } else if (pose === 'tongs') {
    limb([[-20, -78], [-46, -68]], shirt, 13);
    g.lineCap = 'round'; g.strokeStyle = '#3d3d44'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(-50, -68); g.lineTo(-88, -50); g.moveTo(-50, -66); g.lineTo(-86, -42); g.stroke();
    g.strokeStyle = '#b9bec7'; g.lineWidth = 2; g.beginPath(); g.moveTo(-52, -69); g.lineTo(-86, -52); g.stroke();
    circ(-48, -67, 8); fs(skin, INK, 2.5);
    circ(26, -46, 7.5); fs(skin, INK, 2.5);
  } else if (pose === 'plates') {
    limb([[-22, -80], [-38, -100]], shirt, 13); limb([[22, -80], [38, -100]], shirt, 13);
    circ(-38, -102, 7.5); fs(skin, INK, 2.5); circ(38, -102, 7.5); fs(skin, INK, 2.5);
  } else if (pose === 'eat') {
    limb([[-22, -78], [-26, -54]], shirt, 13); circ(-26, -52, 7.5); fs(skin, INK, 2.5);
    limb([[22, -78], [16, -98]], shirt, 13);
    g.strokeStyle = '#9aa3ad'; g.lineWidth = 3.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(14, -102); g.lineTo(6, -118); g.stroke();
    circ(15, -100, 7.5); fs(skin, INK, 2.5);
  }
  // head
  const hy = -128;
  hairBack(o.style, hair, face, hy);
  rr(-7, -98, 14, 10, 4); fs(shade(skin, -0.1), null);
  if (!back) { ell(-38, hy + 6, 7, 9); fs(skin, INK, 2.5); ell(38, hy + 6, 7, 9); fs(skin, INK, 2.5); }
  circ(0, hy, 38); fs(rg(0, hy, 40, [[0, shade(skin, .18)], [0.7, skin], [1, shade(skin, -0.08)]], -10, hy - 12), INK, 3);
  if (back) {
    circ(0, hy - 2, 40); fs(rg(0, hy, 42, [[0, shade(hair, .2)], [1, hair]], -12, hy - 18), INK, 3);
    g.strokeStyle = shade(hair, -0.25); g.lineWidth = 2.5;
    [[-14, 0], [0, 4], [14, 0]].forEach(([a, b]) => { g.beginPath(); g.moveTo(a, hy - 30 + b); g.quadraticCurveTo(a + 6, hy, a - 2, hy + 30); g.stroke(); });
    ell(-14, hy - 20, 12, 6, -0.5); g.fillStyle = 'rgba(255,255,255,.22)'; g.fill();
  } else {
    // face
    for (const sx of [-1, 1]) {
      const ex = sx * 14 + fx, ey = hy + 6;
      ell(ex, ey, 7.5, 10.5); g.fillStyle = '#2b1810'; g.fill();
      ell(ex, ey + 4, 5, 4.5); g.fillStyle = o.eye || '#6b3e22'; g.fill();
      circ(ex - 2.5, ey - 4, 3.2); g.fillStyle = '#fff'; g.fill();
      circ(ex + 2.5, ey + 3, 1.4); g.fillStyle = '#fff'; g.fill();
      ell(sx * 25 + fx * .6, hy + 19, 6.5, 3.8); g.fillStyle = 'rgba(255,110,110,.42)'; g.fill();
    }
    if (o.mouth === 'open') {
      g.beginPath(); g.moveTo(fx - 7, hy + 22); g.quadraticCurveTo(fx, hy + 34, fx + 7, hy + 22); g.closePath(); fs('#a3332e', INK, 2);
    } else {
      g.beginPath(); g.arc(fx, hy + 19, 6, 0.2 * Math.PI, 0.8 * Math.PI); g.strokeStyle = INK; g.lineWidth = 2.6; g.lineCap = 'round'; g.stroke();
    }
    hairFront(o.style, hair, face, hy, o.capColor);
  }
  g.restore();
}
function hairBack(style, col, face, hy) {
  const f = typeof face === 'number' ? face : 0;
  if (style === 'bob') { rr(-45, hy - 40, 90, 82, 38); fs(lg(0, hy - 40, 0, hy + 42, [[0, shade(col, .15)], [1, shade(col, -0.1)]]), INK, 3); }
  if (style === 'long') { rr(-44, hy - 38, 88, 100, 36); fs(lg(0, hy - 40, 0, hy + 60, [[0, shade(col, .15)], [1, shade(col, -0.1)]]), INK, 3); }
  if (style === 'pony') { ell(-f * 30 + (f === 0 ? 36 : 0), hy + 8, 15, 26, 0.3); fs(col, INK, 3); }
  if (style === 'bun') { circ(0, hy - 42, 17); fs(rg(0, hy - 42, 18, [[0, shade(col, .25)], [1, col]], -5, hy - 48), INK, 3); }
  if (style === 'curly') { for (let k = 0; k < 9; k++) { const a = Math.PI * (0.95 + k * 0.1375); circ(Math.cos(a) * 38, hy + Math.sin(a) * 34, 14); fs(col, INK, 3); } }
}
function hairFront(style, col, face, hy, capColor) {
  const f = typeof face === 'number' ? face : 0;
  const fill = rg(0, hy - 20, 46, [[0, shade(col, .25)], [1, col]], -12, hy - 30);
  if (style === 'cap') {
    // short sides
    g.beginPath(); g.arc(0, hy, 40, Math.PI * 0.95, Math.PI * 2.05); g.lineTo(36, hy + 2); g.lineTo(-36, hy + 2); g.closePath(); fs(col, INK, 3);
    const cc = capColor || '#c8442b';
    g.beginPath(); g.arc(0, hy - 6, 41, Math.PI, TAU); g.quadraticCurveTo(0, hy - 14, -41, hy - 6); g.closePath();
    fs(rg(0, hy - 20, 46, [[0, shade(cc, .3)], [1, cc]], -14, hy - 34), INK, 3);
    ell(f * 30, hy - 8, 30, 9, f * 0.25); fs(shade(cc, -0.15), INK, 3);
    circ(0, hy - 46, 4); g.fillStyle = shade(cc, -0.3); g.fill();
    // badge flame
    g.beginPath(); g.moveTo(-f * 6, hy - 32); g.quadraticCurveTo(-f * 6 + 8, hy - 22, -f * 6, hy - 16); g.quadraticCurveTo(-f * 6 - 8, hy - 22, -f * 6, hy - 32); g.fillStyle = '#F3CF6D'; g.fill();
    return;
  }
  if (style === 'curly') { for (let k = 0; k < 6; k++) { circ(-28 + k * 11.5 + f * 4, hy - 26 + (k % 2) * 5, 13); fs(fill, INK, 2.5); } return; }
  const o = f * 6;
  g.beginPath();
  g.arc(0, hy - 2, 41, Math.PI * 1.02, Math.PI * 1.98);
  g.quadraticCurveTo(42, hy + 10, 36, hy + 14);
  g.quadraticCurveTo(26 + o, hy - 14, 14 + o, hy - 8);
  g.quadraticCurveTo(4 + o, hy - 22, -8 + o, hy - 10);
  g.quadraticCurveTo(-20 + o, hy - 22, -30 + o, hy - 6);
  g.quadraticCurveTo(-36, hy + 4, -38, hy + 14);
  g.closePath(); fs(fill, INK, 3);
  ell(-14, hy - 26, 12, 5, -0.4); g.fillStyle = 'rgba(255,255,255,.3)'; g.fill();
  if (style === 'bob' || style === 'long') {
    g.beginPath(); g.moveTo(-40, hy - 4); g.quadraticCurveTo(-46, hy + 26, -38, hy + 38); g.lineTo(-30, hy + 10); g.closePath(); fs(col, INK, 2.5);
    g.beginPath(); g.moveTo(40, hy - 4); g.quadraticCurveTo(46, hy + 26, 38, hy + 38); g.lineTo(30, hy + 10); g.closePath(); fs(col, INK, 2.5);
  }
}

// ---------- scenery ----------
function bush(x, y, r, col = '#5fb543') {
  const pts = [[-0.7, 0.1, .62], [0.7, 0.1, .62], [-0.35, -0.35, .7], [0.35, -0.4, .7], [0, -0.75, .62]];
  pts.forEach(([a, b, k]) => { circ(x + a * r, y + b * r, r * k); fs(rg(x + a * r, y + b * r, r * k, [[0, shade(col, .3)], [1, col]], x + a * r - r * .25, y + b * r - r * .3), shade(col, -0.45), 3); });
}
