// s = device px per font pixel (3 = small body, 4 = medium, 6 = title)
function textW(str, s) { return (str.length * 6 * s - s) / 2; } // CSS px
function text(str, x, y, s, color, shadow) {
  const X0 = D(x), Y0 = D(y);
  const pass = (ox, oy, col) => {
    ctx.fillStyle = col;
    let cx = X0 + ox;
    for (const ch of str) {
      const g = G[ch] || G[' '];
      for (let r = 0; r < 7; r++) for (let k = 0; k < 5; k++) {
        if (g[r][k] === '1') ctx.fillRect(cx + k * s, Y0 + oy + r * s, s + 1, s); // +1 = bold smear

      cx += 6 * s;
    }
  };

// ---------- sprite builder ----------
// Procedural pixel sprites drawn in sprite px, then auto-outlined.
function sprite(w, h, draw, outline = '#1a1220') {
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const g = c.getContext('2d');
  const api = {
    r(x, y, ww, hh, col) { g.fillStyle = col; g.fillRect(x + 1, y + 1, ww, hh); },
    p(x, y, col) { g.fillStyle = col; g.fillRect(x + 1, y + 1, 1, 1); },
    line(x0, y0, x1, y1, col) {
      let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, e = dx + dy;
      for (;;) { api.p(x0, y0, col); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
    },
    disc(cx, cy, rad, col) { for (let y = -Math.ceil(rad); y <= Math.ceil(rad); y++) for (let x = -Math.ceil(rad); x <= Math.ceil(rad); x++) if (x * x + y * y <= rad * rad) api.p(cx + x, cy + y, col); },
    map(rows, pal, ox = 0, oy = 0) { rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) api.p(ox + x, oy + y, pal[ch]); })); }
  };
  draw(api);
  if (outline) {
    const id = g.getImageData(0, 0, c.width, c.height), d = id.data, W = c.width, H = c.height;
    const solid = (x, y) => x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 0;
    const marks = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) marks.push([x, y]);
    g.fillStyle = outline; marks.forEach(([x, y]) => g.fillRect(x, y, 1, 1));
  }
  return c;
}

// locked art: desaturate and pull toward navy (about 40 percent) so locked reads at a glance
function dimArt(x, y, w, h) {
  const X = D(x), Y = D(y), W = D(w), H = D(h);
  const id = ctx.getImageData(X, Y, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) {

    const nav = [24, 32, 74];
    for (let k = 0; k < 3; k++) d[i + k] = Math.round((d[i + k] * 0.55 + l * 0.45) * 0.68 + nav[k] * 0.32);

}

  const y = cy - 8, x = LAD.x + 14 + (LAD.w - 28) - 8 - (lw + 16);
  if (y < cardY(currentIdx - 1) + LAD.cardH + 4) overflow.push('you-are-here tag touches the panel above');
  R(x + 2, y + 2, lw + 16, 16, 'rgba(9,16,52,0.55)');
  box(x, y, lw + 16, 16, C.gold, C.out, 2);
  R(x + 2, y + 12, lw + 12, 2, C.goldDk);
  text(label, x + 8, y + 2.5, 3, '#3a2a08');
})();
// arrow marker on the left rail (pixel triangle, pointing right), 4 px in from the screen edge
(() => {
  const ay = cardY(currentIdx) + LAD.cardH / 2, ax = 4;
  for (let i = 0; i < 7; i++) R(ax + i * 2, ay - 14 + i * 2, 2, 28 - i * 4, C.out);
  for (let i = 0; i < 6; i++) R(ax + 2 + i * 2, ay - 11 + i * 2, 2, 22 - i * 4, C.gold);
  R(ax + 2, ay - 11, 2, 22, '#fff2b8');
})();

// ---------- upgrades column ----------
const UPS = [
  { key: 'cooler', name: 'COOLER', lv: 2, max: 3, fx: 'MORE STOCK', price: '400' },
  { key: 'prep', name: 'PREP TABLE', lv: 1, max: 3, fx: 'QUICK PREP', price: '150' },
  { key: 'canopy', name: 'CANOPY', lv: 0, max: 1, fx: 'RAIN COVER', price: '250' },
  { key: 'truck', name: 'TRUCK', lv: 1, max: 3, fx: 'MORE MILES', price: '600' }
];
UPS.forEach((u, i) => {
  const x = UP.x, y = UP.top + i * (UP.h + UP.gap), w = UP.w, h = UP.h;
  shadowBox(x, y, w, h, C.panel, C.white, 2);
  const wx = x + 4, wy = y + 4, ww = w - 8, wh = 42;
  R(wx, wy, ww, wh - 10, '#94d4ff'); R(wx, wy, ww, 12, '#7cc8ff');
  R(wx, wy + wh - 10, ww, 10, '#d8c49c'); R(wx, wy + wh - 10, ww, 2, '#efe0bd');
  for (let k = 4; k < ww; k += 14) R(wx + k, wy + wh - 5, 6, 2, '#bfa97e');
  const spr = SPR[u.key];
  blit(spr, wx + Math.floor((ww - sw(spr)) / 2), wy + wh - 4 - sh(spr));
  R(wx, wy + wh, ww, 2, '#2e3550');
  fit(u.name, 3, w - 12, 'upname');
  text(u.name, x + 6, y + 54, 3, C.white, '#262c45');
  let sx = x + 6;
  for (let k = 0; k < u.max; k++) { blit(k < u.lv ? SPR.star : SPR.starOff, sx, y + 71, 3); sx += 19; }
  const lvTxt = u.lv + '/' + u.max;
  if (sx - 2 > x + w - 8 - textW(lvTxt, 3) - 2) overflow.push('stars hit level ' + u.key);
  text(lvTxt, x + w - 8 - textW(lvTxt, 3), y + 75, 3, C.cream, '#262c45');
  fit(u.fx, 3, w - 12, 'upfx');
  text(u.fx, x + 6, y + 96, 3, C.gold, '#262c45');
  const by = y + h - 36;
  button(x + 5, by, w - 10, 30, C.orange, C.orangeDk, C.orangeHi);
  const lw = 10.5 + 6 + 10.5 + 3 + textW(u.price, 3);
  let cx = x + 5 + (w - 10 - lw) / 2;
  blit(ICON.upW, cx, by + 6.5, 3); cx += 16.5;
  blit(ICON.coin, cx, by + 6.5, 3); cx += 13.5;
  text(u.price, cx, by + 7, 3, C.white, C.orangeDk);
  if (lw > w - 18) overflow.push('upgrade btn ' + u.key + ' ' + lw);
});

// ---------- bottom bar ----------
(() => {
  const y = 772;
  const x = LAD.x, w = LAD.w, h = 66;
  box(x, y + 6, w, h - 6, C.bg, C.white, 2);
  const label = 'FANS 28 / 40';
  const lw = textW(label, 3) + 10.5 + 6;
  R(x + 12, y, lw + 12, 14, C.bg);
  blit(ICON.heart, x + 18, y + 1.5, 3);
  text(label, x + 18 + 15, y + 2, 3, C.white, C.navy);
  const bx = x + 10, bby = y + 20, bw2 = w - 20, bh = 16;
  R(bx, bby, bw2, bh, C.out);
  R(bx + 2, bby + 2, Math.round((bw2 - 4) * 28 / 40), bh - 4, C.gold);
  R(bx + 2, bby + 2, Math.round((bw2 - 4) * 28 / 40), 2, '#fff2b8');
  const nxt = 'NEXT: STICK BURNER';
  fit(nxt, 3, w - 20, 'next');
  text(nxt, x + w / 2 - textW(nxt, 3) / 2, bby + 23, 3, C.lightBlue, C.navy);
  button(UP.x, y + 10, 58, 50, '#3a6ee6', '#1f45a8', '#6f9bff');
  text('CREW', UP.x + 29 - textW('CREW', 3) / 2, y + 26, 3, C.white, '#1f45a8');
  button(UP.x + 64, y + 10, 42, 50, C.white, '#9aa6c8', '#ffffff');
  const ax = UP.x + 71, ay = y + 30;
  R(ax, ay - 1, 14, 4, C.bg);
  for (let i = 0; i < 6; i++) R(ax + 12 + i * 2, ay - 6 + i, 2, 14 - i * 2, C.bg);
})();

if (overflow.length) console.warn('OVERFLOW ' + overflow.join(' | '));
</script>
