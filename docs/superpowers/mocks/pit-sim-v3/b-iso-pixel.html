<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Your Pit iso mock</title>
<style>
  html, body { margin: 0; padding: 0; background: #1b1714; }
  canvas { display: block; width: 390px; height: 844px; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<!-- Style B: isometric pixel art, Cafeland angle. Native 195x422, shown at 2x CSS (4x device pixels at DPR 2). -->
<canvas id="c" width="195" height="422"></canvas>
<script>
'use strict';
const W = 195, H = 422;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ---------- tiny raster lib (no antialiasing, every pixel placed by hand) ---------- */
const ccache = {};
function pack(c) {
  if (typeof c === 'number') return c;
  if (ccache[c] !== undefined) return ccache[c];
  const n = parseInt(c.slice(1), 16);
  return (ccache[c] = n);
}
function unpack(n) { return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mul(c, f) {
  const [r, g, b] = unpack(pack(c));
  const k = v => Math.max(0, Math.min(255, Math.round(v * f)));
  return (k(r) << 16) | (k(g) << 8) | k(b);
}
function newLayer() { const a = new Int32Array(W * H); a.fill(-1); return a; }
const MAIN = newLayer();
let T = MAIN;
let CLIP = [0, 0, W, H];

function px(x, y, c) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < CLIP[0] || y < CLIP[1] || x >= CLIP[2] || y >= CLIP[3]) return;
  T[y * W + x] = pack(c);
}
function rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); }
function poly(pts, c) {
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  for (let y = Math.floor(minY); y < Math.ceil(maxY); y++) {
    const yc = y + 0.5, xs = [];
    for (let k = 0; k < pts.length; k++) {
      const [x0, y0] = pts[k], [x1, y1] = pts[(k + 1) % pts.length];
      if ((y0 <= yc && y1 > yc) || (y1 <= yc && y0 > yc)) xs.push(x0 + (yc - y0) * (x1 - x0) / (y1 - y0));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.ceil(xs[k] - 0.5), xb = Math.ceil(xs[k + 1] - 0.5);
      for (let x = xa; x < xb; x++) px(x, y, c);
    }
  }
}
function ellipse(cx, cy, rx, ry, c, y0 = -1e9, y1 = 1e9) {
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++) {
    if (y < y0 || y >= y1) continue;
    for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) px(x, y, c);
    }
  }
}
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    px(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// iso 2:1 line: exactly two pixels across per pixel down
function isoLine(x0, y0, n, dir, c) { // dir: +1 = right-down, -1 = left-down; n = steps of 2px
  for (let k = 0; k < n; k++) { px(x0 + dir * 2 * k, y0 + k, c); px(x0 + dir * (2 * k + 1), y0 + k, c); }
}
function beginObj() { T = newLayer(); }
function endObj(ol) {
  const L = T; T = MAIN;
  if (ol !== undefined && ol !== null) {
    const o = pack(ol);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (L[y * W + x] !== -1) continue;
      const n = (x > 0 && L[y * W + x - 1] !== -1) || (x < W - 1 && L[y * W + x + 1] !== -1) ||
                (y > 0 && L[(y - 1) * W + x] !== -1) || (y < H - 1 && L[(y + 1) * W + x] !== -1);
      if (n && x >= CLIP[0] && y >= CLIP[1] && x < CLIP[2] && y < CLIP[3]) MAIN[y * W + x] = o;
    }
  }
  for (let k = 0; k < W * H; k++) if (L[k] !== -1) MAIN[k] = L[k];
}
function shadow(cx, cy, rx, ry, f = 0.78) {
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
    for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy > 1) continue;
      if (x < CLIP[0] || y < CLIP[1] || x >= CLIP[2] || y >= CLIP[3]) continue;
      const k = y * W + x; if (MAIN[k] !== -1) MAIN[k] = mul(MAIN[k], f);
    }
}
// seeded generator, deterministic
let seed = 20261018;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

/* ---------- sprites from strings ---------- */
function sprite(rows, pal, x, y) {
  for (let r = 0; r < rows.length; r++) for (let k = 0; k < rows[r].length; k++) {
    const ch = rows[r][k]; if (ch === '.' || ch === ' ') continue;
    const c = pal[ch]; if (c) px(x + k, y + r, c);
  }
}

/* ---------- bitmap fonts ---------- */
const F5 = {
  'A': ['.###.','#...#','#...#','#####','#...#','#...#','#...#'],
  'B': ['####.','#...#','#...#','####.','#...#','#...#','####.'],
  'C': ['.###.','#...#','#....','#....','#....','#...#','.###.'],
  'E': ['#####','#....','#....','####.','#....','#....','#####'],
  'F': ['#####','#....','#....','####.','#....','#....','#....'],
  'H': ['#...#','#...#','#...#','#####','#...#','#...#','#...#'],
  'I': ['.###.','..#..','..#..','..#..','..#..','..#..','.###.'],
  'K': ['#...#','#..#.','#.#..','##...','#.#..','#..#.','#...#'],
  'N': ['#...#','##..#','#.#.#','#..##','#...#','#...#','#...#'],
  'P': ['####.','#...#','#...#','####.','#....','#....','#....'],
  'R': ['####.','#...#','#...#','####.','#.#..','#..#.','#...#'],
  'S': ['.####','#....','#....','.###.','....#','....#','####.'],
  'T': ['#####','..#..','..#..','..#..','..#..','..#..','..#..'],
  'U': ['#...#','#...#','#...#','#...#','#...#','#...#','.###.'],
  'W': ['#...#','#...#','#...#','#.#.#','#.#.#','##.##','#...#'],
  '0': ['.###.','#...#','#..##','#.#.#','##..#','#...#','.###.'],
  '1': ['..#..','.##..','..#..','..#..','..#..','..#..','.###.'],
  '2': ['.###.','#...#','....#','...#.','..#..','.#...','#####'],
  '3': ['####.','....#','....#','.###.','....#','....#','####.'],
  '4': ['...#.','..##.','.#.#.','#..#.','#####','...#.','...#.'],
  '8': ['.###.','#...#','#...#','.###.','#...#','#...#','.###.'],
  '+': ['.....','..#..','..#..','#####','..#..','..#..','.....'],
  'D': ['####.','#...#','#...#','#...#','#...#','#...#','####.'],
  'V': ['#...#','#...#','#...#','#...#','#...#','.#.#.','..#..'],
  'O': ['.###.','#...#','#...#','#...#','#...#','#...#','.###.'],
  'Y': ['#...#','#...#','.#.#.','..#..','..#..','..#..','..#..'],
  '5': ['#####','#....','####.','....#','....#','#...#','.###.'],
  '6': ['.###.','#....','#....','####.','#...#','#...#','.###.'],
  '/': ['....#','...#.','...#.','..#..','.#...','.#...','#....'],
  ':': ['.','#','#','.','#','#','.'],
  ' ': ['.....','.....','.....','.....','.....','.....','.....'],
};
const F3 = {
  'A': ['.#.','#.#','###','#.#','#.#'], 'B': ['##.','#.#','##.','#.#','##.'], 'C': ['.##','#..','#..','#..','.##'],
  'E': ['###','#..','##.','#..','###'], 'G': ['.##','#..','#.#','#.#','.##'], 'H': ['#.#','#.#','###','#.#','#.#'],
  'I': ['###','.#.','.#.','.#.','###'], 'K': ['#.#','#.#','##.','#.#','#.#'], 'N': ['##.','#.#','#.#','#.#','#.#'],
  'R': ['##.','#.#','##.','#.#','#.#'], 'S': ['.##','#..','.#.','..#','##.'], 'T': ['###','.#.','.#.','.#.','.#.'],
  'U': ['#.#','#.#','#.#','#.#','###'],
};
// bold 5x7: each lit pixel also lights the pixel to its right (6px advance + 1 gap)
function text5(s, x, y, c, shadowC, bold = true) {
  let cx = x;
  for (const ch of s) {
    const g = F5[ch] || F5[' '];
    for (let r = 0; r < 7; r++) for (let k = 0; k < 5; k++) if (g[r][k] === '#') {
      if (shadowC) { px(cx + k, y + r + 1, shadowC); if (bold) px(cx + k + 1, y + r + 1, shadowC); }
    }
    for (let r = 0; r < 7; r++) for (let k = 0; k < 5; k++) if (g[r][k] === '#') {
      px(cx + k, y + r, c); if (bold) px(cx + k + 1, y + r, c);
    }
    cx += g[0].length + (bold ? 2 : 1);
  }
  return cx;
}
function width5(s, bold = true) { let w = 0; for (const ch of s) w += (F5[ch] || F5[' '])[0].length + (bold ? 2 : 1); return w - 1; }
function text3(s, x, y, c) {
  let cx = x;
  for (const ch of s) { const g = F3[ch]; if (g) for (let r = 0; r < 5; r++) for (let k = 0; k < 3; k++) if (g[r][k] === '#') px(cx + k, y + r, c); cx += 4; }
}
function width3(s) { return s.length * 4 - 1; }

/* ---------- palette ---------- */
const OL = '#2a1a14';            // outline
const C = {
  sky: '#9fd9f4', sky2: '#b9e6f8', cloud: '#ffffff',
  hedge: '#3f9248', hedge2: '#56ad57', hedge3: '#2f7a3b',
  grassA: '#80c95b', grassB: '#75bf52', tuftL: '#9ee070', tuftD: '#5ea843',
  pav1: '#e6cc9c', pav2: '#dcbf8b', pav3: '#efd9ae', grout: '#b9976a', pavHi: '#f6e6c4',
  wood: '#c98a4b', woodS: '#a26a36', woodD: '#7c4c25', woodL: '#e2a866',
  fence: '#f4ead2', fenceS: '#d8c9a6', fenceD: '#b5a37f',
  shed: '#c9553d', shedS: '#a8432f', shedL: '#de6e55', trim: '#fbf3e2',
  roof: '#5b6b8a', roofS: '#47546f', roofL: '#7385a6',
  glass: '#8fd3f5', glassL: '#d7f2ff',
  k1: '#24242c', k2: '#383844', k3: '#575769', k4: '#9a9ab0',
  drum: '#c63d2c', drumS: '#94291d', drumL: '#e8604c', drumD: '#5c1d16',
  smoke: '#f3f3f6', smokeS: '#d2d3dc', smokeO: '#9d9eae',
  cloth: '#3f82e0', clothS: '#2c63b8', clothL: '#6ea6f2', clothD: '#214c90',
  plate: '#fbf8f0', plateS: '#d4cec2',
  bark: '#3e2318', meat: '#9c4a34', ring: '#e07a68', fat: '#f1d6a6',
  saus: '#b84d2a', sausL: '#e07a4c', chick: '#d9973d', chickL: '#f2c36a', rib: '#8a3a22', ribL: '#b8603c', bone: '#f7ecd2',
  heart: '#ff4f6d', heartL: '#ffb0bd',
  gold: '#F3CF6D', orange: '#D06129', cream: '#E6D8B8', umber: '#2a2015', ink: '#1b1714',
  bulbs: ['#ffd84f', '#ff8a4f', '#76d2ff', '#9cf06a', '#ff6f9a'],
  soil: '#6e4a2e', soilD: '#56391f',
  flower: ['#ff7aa8', '#ffd84f', '#ffffff', '#ff8a4f', '#c792ff'], leaf: '#3f9a45',
};

/* ---------- iso projection: 32x16 tiles on a 2:1 diamond grid ---------- */
const OX = 97, OY = 86;
const A = t => 2 * Math.round(t * 8);           // tile -> even pixel units so every vertex is an integer
function P(i, j, z = 0) { const a = A(i), b = A(j); return [OX + a - b, OY + (a + b) / 2 - z]; }
function box(i0, j0, i1, j1, z0, h, top, left, right, hi) {
  const z1 = z0 + h;
  poly([P(i0, j1, z0), P(i1, j1, z0), P(i1, j1, z1), P(i0, j1, z1)], left);
  poly([P(i1, j0, z0), P(i1, j1, z0), P(i1, j1, z1), P(i1, j0, z1)], right);
  poly([P(i0, j0, z1), P(i1, j0, z1), P(i1, j1, z1), P(i0, j1, z1)], top);
  if (hi) { // lit front edge of the top face
    const [ax, ay] = P(i0, j1, z1), [bx, by] = P(i1, j1, z1), [cx2, cy2] = P(i1, j0, z1);
    line(ax, ay - 1, bx, by - 1, hi); line(bx, by - 1, cx2, cy2 - 1, hi);
  }
}

/* =========================================================
   SCENE  (clip to the play area between HUD and buttons)
   ========================================================= */
const SCENE_TOP = 42, SCENE_BOT = 368;
CLIP = [0, SCENE_TOP, W, SCENE_BOT];

// sky + clouds
rect(0, SCENE_TOP, W, 120, C.sky);
for (let y = SCENE_TOP; y < SCENE_TOP + 14; y += 2) for (let x = (y / 2) % 2; x < W; x += 2) px(x, y, C.sky2);
function cloud(x, y) {
  beginObj();
  ellipse(x, y, 7, 4, C.cloud); ellipse(x + 7, y - 2, 6, 5, C.cloud); ellipse(x + 14, y, 7, 4, C.cloud);
  rect(x - 4, y + 1, 24, 3, C.cloud);
  endObj(null);
}
cloud(14, 56); cloud(60, 50); cloud(158, 52);

// distant tree line behind the left fence
beginObj();
for (let t = -1; t <= 8; t += 0.55) {
  const [x, y] = P(-1.1, t, 22);
  ellipse(x, y, 9, 8, C.hedge3);
}
for (let t = -1; t <= 8; t += 0.7) {
  const [x, y] = P(-0.5, t, 13);
  ellipse(x, y, 7, 6, C.hedge);
  ellipse(x - 2, y - 2, 3, 2, C.hedge2);
}
// fill down to the fence base
poly([P(-0.5, -1, 10), P(-0.5, 9, 10), P(0, 9, 0), P(0, -1, 0)], C.hedge);
endObj(null);
// tree line behind the right fence (past the shed)
beginObj();
for (let t = 4; t <= 10; t += 0.6) {
  const [x, y] = P(t, -1.0, 24); ellipse(x, y, 9, 8, C.hedge3);
}
for (let t = 4.4; t <= 10; t += 0.7) {
  const [x, y] = P(t, -0.5, 14); ellipse(x, y, 7, 6, C.hedge); ellipse(x - 2, y - 2, 3, 2, C.hedge2);
}
poly([P(4.4, -0.5, 10), P(10, -0.5, 10), P(10, 0, 0), P(4.4, 0, 0)], C.hedge);
endObj(null);

/* ----- ground tiles ----- */
function isPaver(i, j) { return i < 7 && j < 8; }
for (let s = 0; s < 44; s++) for (let i = 0; i <= s; i++) {
  const j = s - i; if (j < 0) continue;
  const [x, y] = P(i, j);
  if (x < -20 || x > W + 20 || y > SCENE_BOT + 2) continue;
  if (isPaver(i, j)) {
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {
      const [sx, sy] = P(i + a / 2, j + b / 2);
      poly([[sx, sy], [sx + 8, sy + 4], [sx, sy + 8], [sx - 8, sy + 4]], C.grout);
      const r = rnd(); const col = r < 0.33 ? C.pav1 : r < 0.66 ? C.pav2 : C.pav3;
      poly([[sx, sy + 1], [sx + 6, sy + 4], [sx, sy + 7], [sx - 6, sy + 4]], col);
      isoLine(sx - 5, sy + 3, 2, 1, C.pavHi);
    }
  } else {
    poly([[x, y], [x + 16, y + 8], [x, y + 16], [x - 16, y + 8]], (i + j) % 2 ? C.grassA : C.grassB);
    for (let k = 0; k < 3; k++) {
      const tx = x - 10 + Math.floor(rnd() * 20), ty = y + 4 + Math.floor(rnd() * 8);
      if (rnd() < 0.5) { px(tx, ty, C.tuftL); px(tx + 1, ty - 1, C.tuftL); px(tx + 2, ty, C.tuftL); }
      else { px(tx, ty, C.tuftD); px(tx + 1, ty, C.tuftD); }
    }
  }
}
// paver edge curb along the lawn
for (let i = 0; i < 7; i++) { const [x, y] = P(i, 8); isoLine(x, y, 8, 1, C.grout); }
for (let j = 0; j < 8; j++) { const [x, y] = P(7, j); isoLine(x, y, 8, -1, C.grout); }
// stepping stones from the front gate up to the line
[0, 1, 2, 3, 4].map(k => [7.16 + k * 0.875, 6.97 + k * 0.875]).forEach(([i, j]) => {
  const [x, y] = P(i, j); shadow(x, y + 1, 6, 3, 0.8);
  beginObj(); ellipse(x, y, 6, 3, '#cfc6b4'); ellipse(x - 1, y - 1, 4, 1.6, '#e8e1d1'); endObj(null);
});

/* ----- back walls ----- */
// shed: front wall along the back right edge, i 0..4.6
const SH = 46, SI = 4.6;
beginObj();
poly([P(0, 0, 0), P(SI, 0, 0), P(SI, 0, SH), P(0, 0, SH)], C.shed);
for (let z = 4; z < SH; z += 5) { const [x0, y0] = P(0, 0, z), [x1, y1] = P(SI, 0, z); line(x0, y0, x1, y1, C.shedS); }
// end wall facing the yard (darker)
poly([P(SI, 0, 0), P(SI, -2.5, 0), P(SI, -2.5, SH + 14), P(SI, 0, SH)], C.shedS);
for (let z = 4; z < SH; z += 5) { const [x0, y0] = P(SI, 0, z), [x1, y1] = P(SI, -2.5, z); line(x0, y0, x1, y1, mul(C.shedS, 0.85)); }
// corner trim
{ const [x, y] = P(SI, 0, 0); rect(x - 1, y - SH, 2, SH, C.trim); }
{ const [x, y] = P(0, 0, 0); rect(x, y - SH, 2, SH, C.trim); }
// window with flower box
{
  const wi0 = 1.5, wi1 = 3.1, z0 = 13, z1 = 30;
  poly([P(wi0, 0, z0 - 1), P(wi1, 0, z0 - 1), P(wi1, 0, z1 + 1), P(wi0, 0, z1 + 1)], C.trim);
  poly([P(wi0 + 0.15, 0, z0 + 1), P(wi1 - 0.15, 0, z0 + 1), P(wi1 - 0.15, 0, z1 - 1), P(wi0 + 0.15, 0, z1 - 1)], C.glass);
  const [mx, my] = P((wi0 + wi1) / 2, 0, z1 - 1); rect(mx, my, 1, z1 - z0 - 2, C.trim);
  const [lx, ly] = P(wi0 + 0.15, 0, (z0 + z1) / 2); line(lx, ly, lx + 23, ly + 11.5, C.trim);
  const [gx, gy] = P(wi0 + 0.35, 0, z1 - 3); line(gx, gy, gx + 4, gy + 6, C.glassL); line(gx + 1, gy, gx + 5, gy + 6, C.glassL);
  const [g2x, g2y] = P(wi0 + 0.9, 0, z1 - 3); line(g2x, g2y, g2x + 2, g2y + 3, C.glassL);
  // flower box
  box(wi0 - 0.05, -0.05, wi1 + 0.05, 0.3, z0 - 6, 5, C.woodL, C.wood, C.woodS);
  for (let k = 0; k < 9; k++) {
    const [fx, fy] = P(wi0 + 0.1 + k * 0.17, 0.12, z0);
    px(fx, fy - 1, C.leaf); px(fx + 1, fy - 1, C.leaf);
    px(fx, fy - 2 - (k % 2), C.flower[k % 3 === 0 ? 0 : k % 3 === 1 ? 1 : 4]);
  }
}
// roof: sloped back, slate blue shingles
poly([P(-0.3, 0.35, SH - 2), P(SI + 0.35, 0.35, SH - 2), P(SI + 0.35, -2.6, SH + 16), P(-0.3, -2.6, SH + 16)], C.roof);
for (let k = 1; k < 7; k++) {
  const f = k / 7, jj = 0.35 - 2.95 * f, zz = SH - 2 + 18 * f;
  const [x0, y0] = P(-0.3, jj, zz), [x1, y1] = P(SI + 0.35, jj, zz); line(x0, y0, x1, y1, C.roofS);
}
{ const [x0, y0] = P(-0.3, 0.35, SH - 2), [x1, y1] = P(SI + 0.35, 0.35, SH - 2); line(x0, y0, x1, y1, C.roofL); line(x0, y0 + 1, x1, y1 + 1, C.roofS); }
endObj(OL);

// picket fence: along i=0 (left back edge) and along j=0 past the shed
function picketRun(alongI, from, to) {
  beginObj();
  const FH = 15;
  // rails
  const rail = (z) => alongI
    ? poly([P(from, 0.05, z), P(to, 0.05, z), P(to, 0.05, z + 2), P(from, 0.05, z + 2)], C.fenceD)

}
function heart(x, y) {
  beginObj();

  px(x - 2, y + 1, C.heartL); px(x - 2, y + 2, '#ffffff');
  endObj(OL);
  // sparkle
  [[x - 7, y - 2], [x + 7, y - 1], [x + 5, y - 5]].forEach(([sx, sy]) => { px(sx, sy, '#fff6b0'); px(sx - 1, sy, '#ffd84f'); px(sx + 1, sy, '#ffd84f'); px(sx, sy - 1, '#ffd84f'); px(sx, sy + 1, '#ffd84f'); });
}
function coin(x, y) {

}

}

{

  for (let k = 1; k < 4; k++) { const tx = bx + 1 + Math.round((bw - 2) * k / 4); rect(tx, by + 1, 1, 5, k * 5 <= 6 ? '#a84a1c' : '#5e4630'); }
}
{ // clock face
  const cx0 = 157, cy0 = 36;

}

// bottom tray
rect(0, SCENE_BOT, W, H - SCENE_BOT, C.umber);
rect(0, SCENE_BOT, W, 1, C.orange);
rect(0, SCENE_BOT + 1, W, 1, '#4a3622');
const meats = [
  { label: 'SAUSAGE', draw: (x, y) => { rect(x - 8, y - 2, 16, 4, C.saus); rect(x - 7, y - 2, 14, 1, C.sausL); px(x - 9, y - 1, C.saus); px(x - 9, y, C.saus); px(x + 8, y - 1, C.saus); px(x + 8, y, C.saus); for (let k = -5; k < 6; k += 4) px(x + k, y, '#7a2c14'); } },
  { label: 'CHICKEN', draw: (x, y) => { ellipse(x - 1, y - 1, 6, 4.5, C.chick); ellipse(x - 2, y - 2, 4, 2.5, C.chickL); rect(x + 4, y + 1, 5, 2, C.bone); rect(x + 8, y, 2, 2, C.bone); rect(x + 8, y + 3, 2, 1, C.bone); px(x - 4, y - 3, '#fff2c0'); } },
  { label: 'RIBS', draw: (x, y) => { rect(x - 8, y - 3, 16, 6, C.rib); rect(x - 8, y - 3, 16, 2, C.ribL); for (let k = -6; k < 8; k += 4) { rect(x + k, y - 4, 1, 9, '#5e2412'); px(x + k, y + 4, C.bone); px(x + k, y - 5, C.bone); } } },
  { label: 'BRISKET', draw: (x, y) => { for (let k = 0; k < 3; k++) { const sx = x - 8 + k * 6; rect(sx, y - 3, 5, 7, C.meat); rect(sx, y - 3, 5, 2, C.bark); rect(sx, y - 1, 5, 1, C.ring); rect(sx, y + 3, 5, 1, C.fat); px(sx + 1, y + 1, '#c06a50'); } } },
];
const BW = 42, BH = 47, gap = (W - 4 * BW) / 5;
meats.forEach((m, k) => {
  const x = Math.round(gap + k * (BW + gap)), y0 = SCENE_BOT + 7;
  const sel = k === 0;
  const y = sel ? y0 - 3 : y0;   // the active dish sits raised on the tray
  // drop shadow (deeper under the raised card)
  rect(x + 1, y0 + 2, BW, BH, '#120d09');
  if (sel) rect(x + 2, y0 + 3, BW, BH - 1, '#0a0705');
  beginObj();
  rect(x, y, BW, BH, sel ? C.gold : '#9a5a2a');
  rect(x + 2, y + 2, BW - 4, BH - 4, C.orange);
  rect(x + 3, y + 3, BW - 6, BH - 6, C.cream);
  rect(x + 3, y + 3, BW - 6, 2, '#f6ecd4');
  endObj(OL);
  // plate under the meat
  beginObj(); ellipse(x + BW / 2, y + 21, 13, 7, C.plateS); ellipse(x + BW / 2, y + 20, 12, 6, C.plate); endObj(OL);
  beginObj(); m.draw(Math.round(x + BW / 2), y + 18); endObj(OL);
  text3(m.label, Math.round(x + (BW - width3(m.label)) / 2), y + BH - 10, '#4a2c16');
  if (sel) { // gold ring outside the outline + bright inner edge
    rect(x - 2, y - 2, BW + 4, 1, C.gold); rect(x - 2, y + BH + 1, BW + 4, 1, C.gold);
    rect(x - 2, y - 2, 1, BH + 4, C.gold); rect(x + BW + 1, y - 2, 1, BH + 4, C.gold);
    rect(x, y, BW, 1, '#fff6c8'); rect(x, y, 1, BH, '#fff6c8');
  }
});

/* ---------- blit ---------- */
const img = ctx.createImageData(W, H);
for (let k = 0; k < W * H; k++) {
  const v = MAIN[k] === -1 ? pack(C.ink) : MAIN[k];
  img.data[k * 4] = (v >> 16) & 255; img.data[k * 4 + 1] = (v >> 8) & 255; img.data[k * 4 + 2] = v & 255; img.data[k * 4 + 3] = 255;
}
ctx.putImageData(img, 0, 0);
