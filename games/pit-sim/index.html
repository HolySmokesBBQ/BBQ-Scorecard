<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Pit</title>
  <meta name="description" content="Run a backyard pit. Light the fire, cook, serve, and decide what to buy with the day's take. A game with game numbers.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1714">
  <style>
    :root {
      --k: #1b1714;
      --u: #2a2015;
      --c: #E6D8B8;
      --o: #D06129;
      --y: #F3CF6D;
      --m: #bfb39a;
      --h: #3a332c;
      --i: #33211A;
      --font: ui-monospace, Menlo, Consolas, monospace;
      --blue: #3a6df0;
      --blue-d: #2550c9;
      --blue-dd: #1a3a96;
      --blue-l: #a9c2ff;
      --ink: #13235c;
      --gold: #F3CF6D;
      --umber2: #3a2c1d;
      --good: #3fae4a;
      --crew: #d8352a;
      --steel: #5a6b84;
      --mustard: #d99a1e;
      --shopg: #3a9a4a;
      --wood: #9c5a2c;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--k); color: var(--c); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
    body { min-height: 100vh; background: var(--k); color: var(--c); overflow-x: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 2px solid var(--y); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    #root { position: relative; max-width: 480px; margin: 0 auto; padding: 0 16px 24px; }
    #hdr { height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; white-space: nowrap; overflow: hidden; }
    #title { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 16px; letter-spacing: 0.08em; font-weight: 700; }
    #hud { flex: none; display: flex; gap: 12px; font-size: 13px; color: var(--m); }
    #hud .stars { color: var(--y); letter-spacing: 0.04em; }
    #hud .stars.fans { color: #f27aa8; letter-spacing: 0; }

    #stage { display: flex; flex-direction: column; gap: 0; }
    #wrap { position: relative; width: 100%; background: var(--k); display: flex; justify-content: center; align-items: flex-start; }
    /* v3.6: on phones the yard is a camera on the world, edge to edge; drag pans, the corner button zooms */
    #root.camnear #wrap { width: auto; margin: 0 -16px; }
    #cv { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
    #zoom { position: absolute; bottom: 6px; right: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--k); border: 2px solid var(--u); box-shadow: inset 0 0 0 1px #000; }
    #zoom canvas { width: 20px; height: 20px; image-rendering: pixelated; image-rendering: crisp-edges; }
    #cv:focus-visible { outline-offset: 0; }
    #status { height: 24px; line-height: 24px; font-size: 13px; color: var(--m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    button.primary, #act { min-height: 44px; background: var(--o); color: var(--k); font-weight: 700; border-radius: 4px; padding: 0 12px; }
    #act { height: 48px; width: 100%; font-size: 16px; }
    #act.idle { visibility: hidden; }
    @media (min-width: 900px) { #status.gate { visibility: hidden; } }
    #act:disabled, button.primary:disabled { background: var(--h); color: var(--m); }
    button.alt { min-height: 44px; background: var(--u); color: var(--c); border: 1px solid var(--h); border-radius: 4px; padding: 0 12px; }
    button.alt:disabled { color: var(--m); }

    #chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); grid-auto-rows: 48px; gap: 4px; height: 48px; margin-top: 4px; }
    .chip { min-height: 44px; min-width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--u); border: 1px solid var(--h); border-radius: 4px; font-size: 12px; color: var(--c); }
    .chip[aria-pressed="true"] { border-color: var(--y); background: var(--i); }
    .chip:disabled { color: var(--m); opacity: 0.6; }
    .chip canvas { display: block; image-rendering: pixelated; }
    .chip.inv { height: 48px; cursor: default; color: var(--y); border-color: var(--u); background: var(--i); }

    #foot { margin-top: 12px; font-size: 12px; color: var(--m); }
    .muted { color: var(--m); font-size: 13px; }

    #panels { position: fixed; inset: 0; z-index: 10; background: rgba(27, 23, 20, 0.85); display: flex; align-items: flex-start; justify-content: center; padding: 8px; overflow: auto; }
    /* position: relative makes each section the containing block of its .sr spans, so they scroll and clip with it (playtest round 1) */
    #panels > section { position: relative; width: 100%; max-width: 448px; max-height: 100%; overflow: auto; background: var(--u); border: 1px solid var(--h); border-radius: 6px; padding: 16px; }
    #panels > section + section { margin-top: 8px; }
    #clip-foot { position: sticky; bottom: 0; margin: 0 -16px -16px; padding: 8px 16px 16px; background: var(--u); border-top: 1px solid var(--h); }
    #panels h2 { font-size: 18px; margin-bottom: 8px; }
    #panels h2:focus { outline: none; }
    #panels h3 { font-size: 14px; color: var(--m); margin: 12px 0 4px; letter-spacing: 0.06em; text-transform: uppercase; }
    #panels p { margin: 4px 0; }
    #panels button { width: 100%; margin-top: 8px; }
    #panels .row button { width: auto; margin-top: 0; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--h); }
    .row:first-child { border-top: 0; }
    .row .name { flex: 1 1 auto; min-width: 0; }
    .row .effect { display: block; font-size: 12px; color: var(--m); }
    .row .price { color: var(--c); white-space: nowrap; }
    .row .price.muted { color: var(--m); }
    .row .step { display: flex; align-items: center; gap: 4px; }
    .row .step span { min-width: 2ch; text-align: center; }
    .row .step button { min-width: 44px; min-height: 44px; }
    .card { border: 1px solid var(--y); border-radius: 4px; padding: 10px; margin: 8px 0; }
    .till .row { font-variant-numeric: tabular-nums; }
    .till .net { font-weight: 700; }
    .dl dt { color: var(--y); margin-top: 6px; }
    .dl dd { margin-left: 0; color: var(--c); }

    /* v3.4 playtest: on desktop the yard fills the window left of the side column, and the side
       column (380 px, SIDE_W in game.js) slides in only while a panel is open */
    @media (min-width: 900px) {
      #root { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; grid-template-areas: "hdr side" "stage side" "foot side"; column-gap: 16px; padding-bottom: 0; }
      #hdr { grid-area: hdr; }
      #stage { grid-area: stage; }
      #foot { grid-area: foot; margin-top: 4px; }
      #panels { grid-area: side; position: sticky; top: 0; align-self: start; width: 380px; max-height: 100vh; background: none; padding: 8px 0 16px; display: block; overflow: auto; animation: side-in 0.18s ease-out; }
      #panels > section { max-width: none; max-height: none; overflow: visible; }
    }
    @keyframes side-in { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #panels { animation: none !important; } }

    @media (max-width: 899px) { #wrap { margin: 0 -8px; width: auto; } }

    .tut-pulse { box-shadow: 0 0 0 3px var(--y); animation: tut-pulse 1.2s ease-in-out infinite; }
    @keyframes tut-pulse { 50% { box-shadow: 0 0 0 3px var(--c); } }
    /* playtest round 3 (Q-7): the pulse ring around a chunky hub button keeps the button's own bevel */
    #panels .hub button.primary.tut-pulse { box-shadow: 0 0 0 3px var(--y), inset 0 3px 0 #f59a60, inset 0 -6px 0 #8a3a14, 0 4px 0 #120d0a; animation: tut-pulse-hub 1.2s ease-in-out infinite; }
    @keyframes tut-pulse-hub { 50% { box-shadow: 0 0 0 3px var(--c), inset 0 3px 0 #f59a60, inset 0 -6px 0 #8a3a14, 0 4px 0 #120d0a; } }

    /* v3.0 season screens (W18), after the screen mocks: blue striped hub, umber cards, chunky buttons. */
    canvas.ut, canvas.px { display: inline-block; vertical-align: middle; image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }
    .utf { font-weight: 700; letter-spacing: 0.04em; line-height: 1.15; }
    /* UI font lines sit on their canvas height, not the body line height */
    .tin > span, .tile .tt, #week-label, #panels .olabel, #offers-h, #next-h, #inv-h, .rbox .rt, .score-v, .fan-d, .val > span:first-child { line-height: 0; }
    #panels > section.hub { max-width: 480px; padding: 12px; color: #fff; border: 2px solid var(--k); border-radius: 0; background-color: var(--blue); background-image: repeating-linear-gradient(to bottom, #3667e8 0, #3667e8 2px, transparent 2px, transparent 8px); container-type: inline-size; }
    #panels .hub button { width: auto; margin-top: 0; }
    #panels .hub h2 { margin: 0 0 8px; }
    #panels .hub h3 { color: #fff; text-transform: none; letter-spacing: 0; margin: 0; font-size: 15px; }
    .hub .muted { color: #dbe6ff; }
    .hub button.primary, #till button.primary { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 12px 10px; border: 2px solid var(--k); border-radius: 0; background: #e0702f; color: #fff4dc; font-weight: 700; box-shadow: inset 0 3px 0 #f59a60, inset 0 -6px 0 #8a3a14, 0 4px 0 #120d0a; }
    .hub button.primary:disabled, #till button.primary:disabled { background: #5a4630; color: var(--m); box-shadow: inset 0 -6px 0 #3a2c1d, 0 4px 0 #120d0a; }
    .hub button.primary:disabled canvas { opacity: 0.5; }
    .hub button.alt { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 12px 8px; border: 2px solid var(--k); border-radius: 0; background: var(--blue); color: #fff; font-weight: 700; box-shadow: inset 0 2px 0 #6a92ff, inset 0 -5px 0 var(--blue-d), 0 3px 0 var(--blue-dd); }
    .hub button.alt[aria-pressed="true"] { background: var(--gold); color: var(--k); box-shadow: inset 0 2px 0 #fff6c9, inset 0 -5px 0 #c4952c, 0 3px 0 var(--blue-dd); }
    .hub button.alt:disabled { color: var(--blue-l); background: var(--blue-d); }
    .hub button.chunky:active:not(:disabled), .hub button.primary:active:not(:disabled), .hub button.alt:active:not(:disabled) { transform: translateY(1px); }
    .card3 { background: var(--u); color: var(--c); border: 2px solid var(--k); box-shadow: inset 0 2px 0 #4a3926, 2px 6px 0 var(--blue-dd); }
    .card3 .muted { color: var(--m); }
    .sign { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; max-width: 100%; padding: 6px 12px 9px; background: var(--wood); border: 2px solid var(--k); box-shadow: inset 0 2px 0 #c98048, inset 0 -4px 0 #6e3a1a, 0 3px 0 var(--blue-dd); overflow: hidden; }
    .sign::before, .sign::after { content: ""; position: absolute; top: 4px; width: 2px; height: 2px; background: #f0dfb4; }
    .sign::before { left: 4px; }
    .sign::after { right: 4px; }

    /* the week hub */
    #week-top { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .wk-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .wk-row .sign { flex: 0 1 auto; min-width: 0; }
    .wk-lab { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
    #panels #week-label, #panels #week-when { margin: 0; }
    /* playtest round 3 (Q-5): the season label stays on one line beside the sign; no pip bar (the strip has the weeks) */
    #week-when { color: #dbe6ff; font-size: 12px; white-space: nowrap; }
    .pills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pill { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 6px; row-gap: 4px; min-height: 36px; padding: 4px 8px; background: #16308c; border: 2px solid #fff; box-shadow: 0 3px 0 var(--blue-dd); }
    .pill .pl { color: #a9c6ff; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill .pv { color: #fff; font-weight: 700; font-size: 15px; line-height: 0; }
    /* playtest round 3 (Q-5): pill labels in the UI font, a short group of words a line */
    .pill .pl.ui { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; line-height: 0; overflow: visible; }
    #week-thirds { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; height: 6px; }
    #week-thirds .seg { background: #0f2266; }
    #week-thirds .seg.on { background: var(--gold); }
    #season-strip { list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 6px; margin: 0 0 14px; padding-top: 6px; }
    #season-strip .wk { position: relative; display: flex; min-height: 46px; background: var(--blue-d); border: 2px solid #fff; box-shadow: 0 3px 0 var(--blue-dd); }
    .wk .tin, .se-wk .tin { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 2px; }
    #season-strip .wk.later { background: #2c56d4; border-color: #6f92f5; }
    #season-strip .wk.now { background: var(--gold); border-color: #fff; outline: 2px solid var(--k); box-shadow: inset 0 -6px 0 #d9a93e, 0 5px 0 var(--blue-dd); }
    #season-strip .wk.fin { grid-column: span 2; background: var(--o); border-color: var(--gold); outline: 2px solid var(--k); }
    #season-strip .wk.fin.now { background: var(--gold); }
    #season-strip .wk.fin .tin { flex-direction: row; gap: 6px; }
    .tfin { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .tfin .tfw { display: block; line-height: 0; }
    .wk .badge { position: absolute; top: -9px; right: -7px; line-height: 0; }
    .tstars { display: flex; gap: 1px; line-height: 0; }
    /* v3.2 Days (D8.2): the day strip in the season strip's family, then the day choice */
    #day-strip { list-style: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 10px; padding: 16px 0 0; }
    #day-strip .dy { position: relative; display: flex; min-width: 0; min-height: 34px; background: var(--blue-d); border: 2px solid #fff; box-shadow: 0 3px 0 var(--blue-dd); }
    #day-strip .dy .tin { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4px 0; overflow: hidden; }
    #day-strip .dy.ahead { background: #2c56d4; border-color: #6f92f5; }
    #day-strip .dy.booked { background: var(--o); border-color: var(--gold); }
    #day-strip .dy.now { background: var(--gold); border-color: #fff; outline: 2px solid var(--k); box-shadow: inset 0 -5px 0 #d9a93e, 0 4px 0 var(--blue-dd); }
    /* v3.4 playtest: the check sits above the tile, centered, so it never covers the day's letters */
    #day-strip .dy .badge { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); line-height: 0; }
    #day-choice { margin-bottom: 12px; }
    /* v3.4 playtest: one big Start button, Change plan, the hub tabs, the rescue and the morning shop */
    #hub-startsec { margin: 0 0 12px; }
    #panels .hub .hub-start { width: 100%; min-height: 72px; margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px; }
    .hub-start .hs-words { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; line-height: 0; }
    #panels #hub-why { margin: 4px 0 0; color: #ffd0b0; font-size: 13px; }
    #panels #hub-why:empty { display: none; }
    #panels .hub .linkish { display: block; width: auto; min-height: 44px; margin: 2px auto 0; padding: 0 12px; background: none; border: 0; color: #dbe6ff; font-size: 14px; font-weight: 700; text-decoration: underline; }
    #hub-plan { margin-top: 4px; }
    .hub-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 0 12px; }
    #panels .hub .htab { width: 100%; min-height: 44px; padding: 0 4px; background: #16308c; border: 2px solid #6f92f5; border-radius: 0; color: #fff; font-size: 14px; font-weight: 700; }
    #panels .hub .htab[aria-selected="true"] { background: var(--gold); border-color: #fff; outline: 2px solid var(--k); color: var(--k); }
    #panels .rescue { margin: 0 0 12px; padding: 10px 12px; background: #2a1c12; border: 2px solid #ff7262; }
    #panels .rescue h3 { color: #ffb070; margin: 0 0 4px; }
    #panels .hub .rescue button { width: 100%; margin-top: 8px; }
    #panels .hub #hub-startsec + .rescue { margin-top: 12px; }
    #panels .rescue .rescue-sub { margin: 8px 0 0; color: #f4e3c4; font-size: 13px; font-weight: 700; }
    #panels .hub .rescue button.alt.quiet { background: transparent; color: #f4e3c4; border-color: #b99a76; box-shadow: none; }
    #panels .hub .rescue button.alt.quiet:disabled { color: #8c7a64; border-color: #5a4836; }
    #panels .offer-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 4px; }
    #panels .offer-line p { margin: 0; color: #fff; font-size: 15px; font-weight: 700; }
    #panels .hub .offer-line .linkish { margin: 0; flex: none; }
    .row .needtag { display: inline-block; margin: 2px 0 2px 6px; padding: 1px 6px; background: #f0c860; color: #2a1a0a; font-size: 12px; font-weight: 700; }
    #panels .mshop { position: sticky; bottom: -16px; z-index: 2; margin: 10px -12px 0; padding: 8px 12px 12px; background: #2a1c12; border-top: 2px solid var(--gold); box-shadow: 0 -6px 12px rgba(0, 0, 0, 0.35); }
    #panels .mshop .mtotal { font-weight: 700; }
    #panels .mshop .mwarn { color: #ffb070; font-weight: 700; }
    #panels .mshop .mrow { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 8px; }
    #panels .hub .mshop .mrow button { width: 100%; min-height: 52px; margin: 0; }
    #panels #shop-price.low { color: #9ff0a8; }
    #panels #shop-price.high { color: #ffb070; }
    #panels #day-choice-h { line-height: 0; }
    #panels #day-price { flex: 0 1 auto; margin: 0; color: #dbe6ff; font-size: 12px; font-weight: 700; line-height: 1.2; text-align: right; }
    #panels #day-price.low { color: #9ff0a8; }
    #panels #day-price.high { color: #ffb070; }
    .day-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
    .dopt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .dopt.devent { grid-column: 1 / -1; }
    #panels .hub .dopt button.alt { width: 100%; }
    #panels .dopt .dhint { margin: 0; font-size: 12px; line-height: 1.3; }
    #panels .hub .dopt .go { width: 100%; margin: 0; }
    #panels #day-choice #go-why { padding: 2px 0 0; color: #dbe6ff; }
    #panels #day-choice #go-why:empty { display: none; }
    .dopt .dhint .hs, .fit8 .dopt .dhint .hl { display: none; }
    .fit8 .dopt .dhint .hs { display: inline; }
    .fit9 .dopt .dhint:not(.why) { display: none; }
    .fit8 .dopt.lone { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 8px; }
    #panels .fit8 .dopt.lone button.alt { width: calc(50% - 4px); flex: none; }
    #panels .dopt .dhint.warn { color: #ffb070; }
    #panels .offer .owhy { color: #ffb070; }
    .offer.shut .book { opacity: 0.6; }
    @container (max-width: 330px) { #day-strip { gap: 2px; } #day-strip .dy .badge { right: -4px; } }
    /* past the day hints (D8.2, game.js fitWeek): step 6 drops the hub tiles' windows and the mix hint, step 7 sets the season strip on one row with numbers, checks and the cup only */
    .fit6 #hub-grid .tile .win { display: none; }
    #panels .fit6 #next-hint { display: none; }
    .fit7 #season-strip { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px 4px; }
    .fit7 #season-strip .wk { min-height: 34px; }
    .fit7 #next-event .next-txt .oline { display: none; }
    .fit7 #season-strip .tnow, .fit7 #season-strip .tq, .fit7 #season-strip .tstars, .fit7 #season-strip .tfin, .fit7 #season-strip .tyard { display: none; }
    .oday { position: absolute; right: 8px; top: -9px; z-index: 1; padding: 2px 3px 3px; background: var(--k); border: 1px solid var(--gold); line-height: 0; }
    /* v3.2 Days (D8.3): the result card */
    #panels #daycard-h { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 44px; line-height: 0; }
    #panels .dc-card { margin-bottom: 12px; padding: 10px 12px; }
    #panels .dc-card p { margin: 0 0 6px; }
    #panels .dc-card p:last-child { margin-bottom: 0; }
    #daycard-cash { margin-bottom: 14px; }
    #panels .hub #daycard-next { width: 100%; }
    #offers { margin-bottom: 12px; }
    .offers-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .pick-one { color: #dbe6ff; font-size: 13px; }
    .offer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
    .offer { display: flex; flex-direction: column; padding: 4px; min-width: 0; }
    .offer.picked { outline: 3px solid var(--o); outline-offset: 1px; }
    .offer.yard, .offer.wide { grid-column: 1 / -1; }
    .band { display: flex; align-items: flex-end; justify-content: center; height: 72px; overflow: hidden; border: 2px solid var(--k); background: linear-gradient(to bottom, #9ad6ff 0, #b4e3ff 58%, #6cc644 58%, #4fa83d 100%); }
    .band canvas { margin-bottom: 4px; }

    /* review 1: the compact money rows stay one line each; a long detail ends in an ellipsis */
    #till.booking #rep-money .row .name { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; font-size: 14px; }
    #till.booking #rep-money .row .effect { overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; }
    #panels #rep-crew .bad, #panels #rep-left { margin: 6px 0 0; font-weight: 700; }
    #panels .se-crew { color: var(--u); }
    /* the report's shrink steps (X13.6, game.js fitTill) */
    #panels #till.rfit1 #till-h.hero { height: 96px; padding-top: 6px; }
    #panels .rfit2 #rep-cooler, #panels .rfit2 #rep-charcoal { display: inline; margin-right: 6px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
