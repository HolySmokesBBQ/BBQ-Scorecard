<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Pit</title>
  <meta name="description" content="Run a backyard pit. Light the fire, cook, serve, and decide what to buy with the day's take. A game with game numbers.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1714">
  <style>
    :root {
      --k: #1b1714;
      --u: #2a2015;
      --c: #E6D8B8;
      --o: #D06129;
      --y: #F3CF6D;
      --m: #bfb39a;
      --h: #3a332c;
      --i: #33211A;
      --font: ui-monospace, Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--k); color: var(--c); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
    body { min-height: 100vh; background: var(--k); color: var(--c); overflow-x: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 2px solid var(--y); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    #root { position: relative; max-width: 480px; margin: 0 auto; padding: 0 16px 24px; }
    #hdr { height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; white-space: nowrap; overflow: hidden; }
    #title { font-size: 16px; letter-spacing: 0.08em; font-weight: 700; }
    #hud { display: flex; gap: 12px; font-size: 13px; color: var(--m); }
    #hud .stars { color: var(--y); letter-spacing: 0.04em; }

    #stage { display: flex; flex-direction: column; gap: 0; }
    #wrap { width: 100%; background: var(--k); display: flex; justify-content: center; align-items: flex-start; }
    #cv { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; }
    #cv:focus-visible { outline-offset: 0; }
    #status { height: 24px; line-height: 24px; font-size: 13px; color: var(--m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    button.primary, #act { min-height: 44px; background: var(--o); color: var(--k); font-weight: 700; border-radius: 4px; padding: 0 12px; }
    #act { height: 48px; width: 100%; font-size: 16px; }
    #act:disabled, button.primary:disabled { background: var(--h); color: var(--m); }
    button.alt { min-height: 44px; background: var(--u); color: var(--c); border: 1px solid var(--h); border-radius: 4px; padding: 0 12px; }
    button.alt:disabled { color: var(--m); }

    #chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; height: 48px; margin-top: 4px; }
    .chip { min-height: 44px; min-width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--u); border: 1px solid var(--h); border-radius: 4px; font-size: 12px; color: var(--c); }
    .chip[aria-pressed="true"] { border-color: var(--y); background: var(--i); }
    .chip:disabled { color: var(--m); opacity: 0.6; }
    .chip canvas { display: block; image-rendering: pixelated; }

    #foot { margin-top: 12px; font-size: 12px; color: var(--m); }
    .muted { color: var(--m); font-size: 13px; }

    #panels { position: fixed; inset: 0; z-index: 10; background: rgba(27, 23, 20, 0.85); display: flex; align-items: flex-start; justify-content: center; padding: 8px; overflow: auto; }
    #panels > section { width: 100%; max-width: 448px; max-height: 100%; overflow: auto; background: var(--u); border: 1px solid var(--h); border-radius: 6px; padding: 16px; }
    #panels > section + section { margin-top: 8px; }
    #clip-foot { position: sticky; bottom: 0; margin: 0 -16px -16px; padding: 8px 16px 16px; background: var(--u); border-top: 1px solid var(--h); }
    #panels h2 { font-size: 18px; margin-bottom: 8px; }
    #panels h2:focus { outline: none; }
    #panels h3 { font-size: 14px; color: var(--m); margin: 12px 0 4px; letter-spacing: 0.06em; text-transform: uppercase; }
    #panels p { margin: 4px 0; }
    #panels button { width: 100%; margin-top: 8px; }
    #panels .row button { width: auto; margin-top: 0; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--h); }
    .row:first-child { border-top: 0; }
    .row .name { flex: 1 1 auto; min-width: 0; }
    .row .effect { display: block; font-size: 12px; color: var(--m); }
    .row .price { color: var(--c); white-space: nowrap; }
    .row .price.muted { color: var(--m); }
    .row .step { display: flex; align-items: center; gap: 4px; }
    .row .step span { min-width: 2ch; text-align: center; }
    .row .step button { min-width: 44px; min-height: 44px; }
    .card { border: 1px solid var(--y); border-radius: 4px; padding: 10px; margin: 8px 0; }
    .till .row { font-variant-numeric: tabular-nums; }
    .till .net { font-weight: 700; }
    .dl dt { color: var(--y); margin-top: 6px; }
    .dl dd { margin-left: 0; color: var(--c); }

    @media (min-width: 900px) {
      #root { max-width: 960px; display: grid; grid-template-columns: 1fr 320px; grid-template-areas: "hdr hdr" "stage side" "foot foot"; column-gap: 24px; }
      #hdr { grid-area: hdr; }
      #stage { grid-area: stage; }
      #foot { grid-area: foot; }
      #panels { grid-area: side; position: static; background: none; padding: 0; display: block; overflow: visible; }
      #panels > section { max-width: none; max-height: none; overflow: visible; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
  <script src="./sprites.js" defer></script>
  <script src="./sim.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body>
  <main id="root" data-phase="morning">
    <header id="hdr">
      <h1 id="title">YOUR PIT</h1>
      <div id="hud">
        <span id="hud-day"></span>
        <span id="hud-cash"></span>
        <span id="hud-rep" class="stars"></span>
      </div>
    </header>

    <div id="stage">
      <div id="wrap">
        <canvas id="cv" width="208" height="240" tabindex="0" role="img" aria-label="The yard"></canvas>
      </div>
      <p id="status" aria-hidden="true"></p>
      <button id="act" type="button">Walk</button>
      <div id="chips" role="group" aria-label="Meat"></div>
    </div>

    <div id="panels" hidden>
      <section id="clipboard" role="dialog" aria-modal="true" aria-labelledby="clipboard-h" hidden>
        <h2 id="clipboard-h" tabindex="-1"></h2>
        <div id="clip-top"></div>
        <div id="shop"></div>
        <div id="hire"></div>
        <div id="clip-foot"></div>
      </section>

      <section id="till" class="till" role="dialog" aria-modal="true" aria-labelledby="till-h" hidden>
        <h2 id="till-h" tabindex="-1"></h2>
        <div id="till-body"></div>
      </section>

      <section id="pause" role="dialog" aria-modal="true" aria-labelledby="pause-h" hidden>
        <h2 id="pause-h" tabindex="-1"></h2>
        <div id="pause-body"></div>
      </section>

      <section id="howto" aria-labelledby="howto-h" hidden>
        <h2 id="howto-h"></h2>
        <div id="howto-body"></div>
      </section>

      <section id="newgame" role="dialog" aria-modal="true" aria-labelledby="newgame-h" hidden>
        <h2 id="newgame-h" tabindex="-1"></h2>
        <div id="newgame-body"></div>
      </section>

      <section id="broke" role="dialog" aria-modal="true" aria-labelledby="broke-h" hidden>
        <h2 id="broke-h" tabindex="-1"></h2>
        <div id="broke-body"></div>
      </section>
    </div>

    <p id="foot">Game numbers, not real prices or a cooking guide. Saved in this browser only.</p>
    <div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
    <noscript><p class="muted">This game runs in your browser and needs JavaScript turned on.</p></noscript>
  </main>
</body>
</html>
