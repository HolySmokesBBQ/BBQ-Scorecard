# Codemagic CI — BBQ Scorecard iOS build (Path B: cloud Mac, no Apple hardware).
#
# This pipeline is written and structurally complete, but it is NOT yet
# runnable — it needs the Apple-account values that only exist once the
# Apple Developer Program membership is active. Every one of those is an
# environment variable in the `appstore_credentials` group, NOT hardcoded
# here. Nothing in this file has been run; the first real execution is on
# Codemagic's Mac.
#
# ── To activate (the "greenlight" step) ─────────────────────────────
# 1. Sign up at codemagic.io, connect the GitHub repo
#    HolySmokesBBQ/BBQ-Scorecard.
# 2. Apple Developer Program must be active ($99/yr membership — a
#    subscription, not hardware).
# 3. In App Store Connect: Users and Access → Integrations → App Store
#    Connect API → create a key. Note the Key ID, Issuer ID, and the
#    downloaded .p8 private key.
# 4. In Codemagic: Team settings -> Integrations -> App Store Connect ->
#    add the key (Issuer ID, Key ID, upload the .p8) and name the
#    integration EXACTLY "BBQ_Scorecard_ASC_KEY". The workflow references
#    it via integrations.app_store_connect + publishing auth: integration,
#    so no environment group is needed. Codemagic auto-creates the signing
#    certificate through fetch-signing-files --create.
# 5. Register the bundle id com.holysmokesbbq.scorecard in App Store
#    Connect, create the app record.
# 6. Flip `submit_to_testflight` to true when ready for the first tester
#    build.
#
# ── The one thing CI cannot do ──────────────────────────────────────
# Sign in with Apple must be CODED before the App Store accepts this app
# (it is Google-sign-in-only today — automatic rejection under Guideline
# 4.8), and it can only be verified on a real iPhone. That is a tester's
# device, not yours and not the cloud Mac. See ios/SETUP.md step 3.

workflows:
  ios-release:
    name: BBQ Scorecard iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Fill in the App Store Connect API key name once created (step 3).
      app_store_connect: BBQ_Scorecard_ASC_KEY
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.holysmokesbbq.scorecard"
      # Capacitor 8 CLI requires Node >= 22.
      node: 22
      xcode: latest
    scripts:
      - name: Install JS dependencies
        # `npm install`, not `npm ci`: the committed lock and the CI runner's
        # npm resolve some transitive deps (e.g. picomatch) to different
        # versions, and npm ci hard-fails on any mismatch. npm install
        # reconciles them on the runner. Tighten back to npm ci once the lock
        # is regenerated with the same npm major as the Codemagic image.
        script: npm install --no-audit --no-fund
      - name: Build web assets (native target)
        script: npm run build:native
      - name: Capacitor sync iOS
        # Copies dist-native/ into the iOS project and refreshes native
        # deps. Capacitor 8 uses Swift Package Manager, so there is no
        # `pod install` step.
        script: npx cap sync ios
      - name: Fetch signing files (App Store Connect API key)
        # Uses a PERSISTENT certificate private key stored in Codemagic as the
        # CERTIFICATE_PRIVATE_KEY environment variable (secure). Every build
        # reuses ONE distribution certificate instead of creating a new one
        # each run — generating a fresh key per build previously hit Apple's
        # distribution-certificate limit (409 "already have a current
        # certificate").
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certs to keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Apply provisioning profiles to the project
        script: xcode-project use-profiles
      - name: Resolve Swift Package dependencies
        # Capacitor 8 uses SPM; a fresh CI checkout has no resolved packages,
        # which makes the build-ipa preflight `xcodebuild -showBuildSettings`
        # fail ("Failed to show build settings"). Resolve first. If this step
        # errors, its output shows xcodebuild's real error (the wrapper hides
        # it).
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Pushes a successful build straight to TestFlight so iPhone-owning
        # testers can install it. Add them under the app's TestFlight tab.
        submit_to_testflight: true
