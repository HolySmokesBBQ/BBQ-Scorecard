# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Full R8 optimization mode — enables deeper code shrinking, obfuscation, and
# inlining that goes beyond the default "compat" mode. Play Console flagged
# Board's optimization/obfuscation/shrinking rates at 39% under compat mode.
# Full mode addresses that + reduces install size and memory footprint.
# If any Firebase/Capacitor callback stops working after this change, add a
# -keep rule to app/proguard-rules.pro rather than disabling this flag.
android.enableR8.fullMode=true

# Non-transitive R8 resource references — matches the "Optimized resource
# shrinking" recommendation from Play Console. Requires shrinkResources=true
# in app/build.gradle release block (already set).
android.nonTransitiveRClass=true

# Newer, precision-shrinking resource shrinker. Removes drawables / layouts
# that R8's default resource shrinker misses because they're only referenced
# from unused code paths that shrinker itself removed in the same pass.
android.enableNewResourceShrinker.preciseShrinking=true
